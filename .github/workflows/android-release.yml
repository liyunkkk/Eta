name: Eta Build

on:
  push:
    branches:
      - main
      - "feat/*"
      - "sync-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    name: 构建 Debug 与 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 检查并还原发布证书
        id: signing
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          configured=0
          [[ -n "$ETA_RELEASE_KEYSTORE_BASE64" ]] && configured=$((configured + 1))
          [[ -n "$ETA_RELEASE_STORE_PASSWORD" ]] && configured=$((configured + 1))
          [[ -n "$ETA_RELEASE_KEY_ALIAS" ]] && configured=$((configured + 1))
          [[ -n "$ETA_RELEASE_KEY_PASSWORD" ]] && configured=$((configured + 1))

          if [[ "$configured" -eq 0 ]]; then
            temporary_store="$RUNNER_TEMP/eta-r8-release.jks"
            temporary_password="eta-r8-temporary"
            temporary_alias="eta-r8"
            keytool -genkeypair \
              -keystore "$temporary_store" \
              -storepass "$temporary_password" \
              -keypass "$temporary_password" \
              -alias "$temporary_alias" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 3650 \
              -dname "CN=Eta R8 Temporary Build,OU=GitHub Actions,O=Eta,C=CN" \
              -noprompt
            {
              echo "ETA_RELEASE_STORE_FILE=$temporary_store"
              echo "ETA_RELEASE_STORE_PASSWORD=$temporary_password"
              echo "ETA_RELEASE_KEY_ALIAS=$temporary_alias"
              echo "ETA_RELEASE_KEY_PASSWORD=$temporary_password"
            } >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "temporary=true" >> "$GITHUB_OUTPUT"
            echo "未配置正式签名 Secrets，已生成临时证书用于 R8 Release 构建。"
            exit 0
          fi
          if [[ "$configured" -ne 4 ]]; then
            echo "::error::Release 签名 Secrets 配置不完整，请补齐或全部移除。"
            exit 1
          fi

          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/eta-release.jks"
          {
            echo "ETA_RELEASE_STORE_FILE=$RUNNER_TEMP/eta-release.jks"
            echo "ETA_RELEASE_STORE_PASSWORD=$ETA_RELEASE_STORE_PASSWORD"
            echo "ETA_RELEASE_KEY_ALIAS=$ETA_RELEASE_KEY_ALIAS"
            echo "ETA_RELEASE_KEY_PASSWORD=$ETA_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "temporary=false" >> "$GITHUB_OUTPUT"

      - name: 运行定向单元测试
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:testDebugUnitTest
          --tests io.github.mangi.eta.agent.model.ProviderRequestHeadersTest
          --tests io.github.mangi.eta.agent.model.ProviderUrlsTest
          --tests io.github.mangi.eta.ui.app.AgentConversationStoreTest

      - name: 构建 Debug APK
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:assembleDebug

      - name: 构建 R8 Release APK
        if: steps.signing.outputs.enabled == 'true'
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:assembleRelease

      - name: 验证并整理 APK
        id: apk
        env:
          RELEASE_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release.apk"
          output_dir="$RUNNER_TEMP/apks"

          if [[ ! -f "$debug_apk" ]]; then
            echo "::error::未找到 Debug APK。"
            exit 1
          fi

          mkdir -p "$output_dir"
          cp "$debug_apk" "$output_dir/app-debug.apk"
          echo "debug_path=$output_dir/app-debug.apk" >> "$GITHUB_OUTPUT"

          if [[ "$RELEASE_ENABLED" == "true" ]]; then
            apksigner_path="$(find "$ANDROID_HOME/build-tools" \
              -type f -name apksigner | sort -V | tail -n 1)"
            if [[ ! -f "$release_apk" ]]; then
              echo "::error::未找到 Release APK。"
              exit 1
            fi
            if [[ -z "$apksigner_path" ]]; then
              echo "::error::未找到 apksigner。"
              exit 1
            fi
            "$apksigner_path" verify "$release_apk"
            cp "$release_apk" "$output_dir/app-release-r8.apk"
            echo "release_path=$output_dir/app-release-r8.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.debug_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 上传 R8 Release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
